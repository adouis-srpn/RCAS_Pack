PART
{
	name = xuntian
	module = Part
	author = SRP
	MODEL
	{
	model = RealChinasAstronomySatellitePack/Parts/Station/CSST/csst
	scale = 1.0, 1.0, 1.0
	}
	mesh = csst
	rescaleFactor = 1
	node_stack_bottom = 0, -4.12197, 0, 0.0, -1.0, 0.0, 2
	node_stack_1 = 0.0, -3.96, 0.0, 0.0, -1, 0.0
	techRequired = advExploration
	entryCost = 5000
	cost = 2000
	category = Pods
	subcategory = 0
	title = #Station_CSST_title
	manufacturer = #Station_CSST_manufacturer
	description = #Station_CSST_description
	attachRules = 1,0,1,1,0
	mass = 8.0
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 60
	maxTemp = 2900
	breakingForce = 2000
	breakingTorque = 2000
	thermalMassModifier = 2.0
	emissiveConstant = 0.95
	heatConductivity = 0.04

	CrewCapacity = 0
	vesselType = Ship

	MODULE
	{
 	name = ModuleCommand
 	minimumCrew = 0
defaultControlPointDisplayName = #autoLOC_6011000 //#autoLOC_6011000 = Up
		CONTROLPOINT
		{
			name = forward
			displayName = #autoLOC_6011001 //#autoLOC_6011001 = Forward
			orientation = 90,0,0
		}
		CONTROLPOINT
		{
			name = reverse
			displayName = #autoLOC_6011004 //#autoLOC_6011004 = Reversed
			orientation = 180,0,0
		}
		RESOURCE
		{
		name = ElectricCharge
		rate = 0.01
		}

	}
	MODULE
	{
		name = ModuleReactionWheel
	
		PitchTorque = 1
		YawTorque = 1
		RollTorque = 1
	
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.05
		}
	}
	MODULE
	{
	name = ModuleSAS
	SASServiceLevel = 3
	}
	RESOURCE
	{
	name = ElectricCharge
	amount = 1000
	maxAmount = 1000
	}
	RESOURCE
	{
		name = MonoPropellant
		amount = 1750
		maxAmount = 1750
	}

	EFFECTS
	{
		running
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_mini
				volume = 0.0 0.0
				volume = 1.0 0.5
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}
			MODEL_MULTI_PARTICLE
			{
				modelName = Squad/FX/Monoprop_big
				transformName = thrustTransform
				emission = 0.0 0.0
				emission = 0.4 0.8
				emission = 1.0 1.0
				speed = 0.0 0.8
				speed = 1.0 1.0
				//localOffset = 0, 0, 1
				localPosition = 0, 0, 0.12
			}
		}	
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}	
		running_rcs
		{
			AUDIO_MULTI_POOL
			{
				channel = Ship
				transformName = RCSthruster
				clip = sound_rocket_mini
				volume = 0.0 0.0
				volume = 0.1 0.0
				volume = 0.5 0.025
				volume = 1.0 0.1
				pitch = 0.0 0.75
				pitch = 1.0 1.5
				loop = true
			}
			MODEL_MULTI_PARTICLE
			{
				modelName = Squad/FX/Monoprop_small
				transformName = RCSthruster
				emission = 0.0 0.0
				emission = 0.1 0.0
				emission = 1.0 1.0
				speed = 0.0 0.8
				speed = 1.0 1.0
				localRotation = -90, 0, 0
			}
		}
	}
	MODULE
	{
		name = ModuleRCSFX
		stagingEnabled = true
		thrusterTransformName = RCSthruster
		thrusterPower = 1.875
		resourceName = MonoPropellant
		resourceFlowMode = STAGE_PRIORITY_FLOW
		runningEffectName = running_rcs
		atmosphereCurve
		{
			key = 0 220
			key = 1 100
			key = 4 0.001
		}
	}
	MODULE
	{
		name = ModuleEnginesFX
		thrustVectorTransformName = thrustTransform
		exhaustDamage = False
		ignitionThreshold = 0.1
		minThrust = 0
		maxThrust = 16
		heatProduction = 30
		fxOffset = 0, 0, 1.02
		EngineType = MonoProp
		exhaustDamageDistanceOffset = 0.25
		runningEffectName = running
		PROPELLANT
		{
			name = MonoPropellant
			ratio = 0.9
			DrawGauge = True
		}
		atmosphereCurve
		{
			key = 0 260
			key = 1 120
			key = 4 0.001
		}
	}
	MODULE
	{
	name = ModuleScienceContainer
	
	reviewActionName = Review Data
	storeActionName = Store Experiments	
	collectActionName = Take Data
	
	evaOnlyStorage = False
	storageRange = 2
	
	allowRepeatedSubjects = True
	}
	MODULE
	{
		name = ModuleScienceExperiment	
	
		experimentID = crewReport
	
		experimentActionName = Probe Report
		resetActionName = Discard Probe Report
		reviewActionName = Review Report
	
		useStaging = False	
		useActionGroups = True
		hideUIwhenUnavailable = True	
		rerunnable = True
	
		xmitDataScalar = 1.0
	}
	MODULE
	{
		name = ModuleAnimateGeneric
		animationName = Antenna
		startEventGUIName = #Station_CSST_extendantenna
		endEventGUIName = #Station_CSST_retractantenna
		actionGUIName = Antenna
	}
	MODULE
	{
		name = ModuleDataTransmitter
		antennaType = RELAY
		packetInterval = 0.17
		packetSize = 2
		packetResourceCost = 13.0
		requiredResource = ElectricCharge
		antennaPower = 3500000000
	}
	MODULE
	{
		name = ModuleDeployableSolarPanel
		isTracking = true
		animationName = SolarPanel
		secondaryTransformName = suncatcher
		pivotName = SolarPanel
		isBreakable = false
		resourceName = ElectricCharge
		chargeRate = 2.5
		extendActionName = #autoLOC_6001805 //#autoLOC_6001805 = Extend <<1>>
		retractActionName = #autoLOC_6001806 //#autoLOC_6001806 = Retract <<1>>
		extendpanelsActionName = #autoLOC_6001807 //#autoLOC_6001807 = Toggle <<1>>
	}
	MODULE
	{
		name = ModuleAnimateGeneric
		animationName = Panel
		startEventGUIName = #Station_CSST_open
		endEventGUIName = #Station_CSST_close
	}

	MODULE
	{
		name = MuMechModuleHullCameraZoom
		cameraName = #CSST_Camera	
		cameraForward = 0, 1, 0
		cameraUp = 0, 1, 0
		cameraPosition = 0.00, 8.40, 0.699
		cameraFoVMax = 60
		cameraFoVMin = 0.0005
	}
