	breakingTorque = 2000
	thermalMassModifier = 2.0
	emissiveConstant = 0.95
	heatConductivity = 0.04

	CrewCapacity = 0
	vesselType = Probe

	MODULE
	{
 	name = ModuleCommand
 	minimumCrew = 0
defaultControlPointDisplayName = #autoLOC_6011000 //#autoLOC_6011000 = Up
		CONTROLPOINT
		{
			name = forward
			displayName = #autoLOC_6011001 //#autoLOC_6011001 = Forward
			orientation = 90,0,0
		}
		CONTROLPOINT
		{
			name = reverse
			displayName = #autoLOC_6011004 //#autoLOC_6011004 = Reversed
			orientation = 180,0,0
		}
		RESOURCE
		{
		name = ElectricCharge
		rate = 0.01
		}

	}
	MODULE
	{
		name = ModuleReactionWheel
	
		PitchTorque = 1
		YawTorque = 1
		RollTorque = 1
	
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.05
		}
	}
	MODULE
	{
	name = ModuleSAS
	SASServiceLevel = 3
	}
	RESOURCE
	{
	name = ElectricCharge
	amount = 1000
	maxAmount = 1000
	}
	RESOURCE
	{
		name = MonoPropellant
		amount = 10
		maxAmount = 10
	}
	RESOURCE
	{
		name = SolidFuel
		amount = 1.0
		maxAmount = 1.0
	}

	EFFECTS
	{
		running
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_mini
