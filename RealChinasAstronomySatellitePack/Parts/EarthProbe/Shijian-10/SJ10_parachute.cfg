PART
{
    name = SJ10_parachute
    module = Part
    author = SRP

    MODEL
    {
        model = RealChinasAstronomySatellitePack/Parts/EarthProbe/Shijian-10/SJ10_parachute
        scale = 1.0, 1.0, 1.0
    }
	MODEL
	{
		model = RealChute/Parts/model_RC_canopy
		//scale = x-width, height, y-width
		//at normal scale (1, 1, 1) the parachute has an in game width of 9.893m
		//do the math if you want to change it
   		scale = 3.03, 2.8, 3.03
		position = 0.0, -0.109412, 0.0
		texture = RC_canopy_drogue, RealChute/Parts/RC_canopy_drogue
	}
	rescaleFactor = 1

    // 连接点设置
    attachRules = 1,0,1,1,0 // 允许顶部连接、底部连接、径向连接
    node_stack_bottom = 0.0, -0.0229, 0.0, 0.0, -1.0, 0.0, 1 // 底部连接点：位置(x,y,z)，方向(x,y,z)，尺寸
    node_stack_top = 0.0, 0.0603, 0.0, 0.0, 1.0, 0.0, 1 // 顶部连接点

    // 游戏内显示信息
    title = #EarthProbe_SJ10_parachute_title
    manufacturer = #EarthProbe_SJ10_parachute_manufacturer
    description = #EarthProbe_SJ10_parachute_description
    category = Utility // 分类：实用工具
    subcategory = 0
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 1
	bulkheadProfiles = srf
    techRequired = specializedControl // 解锁所需科技
    entryCost = 5000 // 解锁费用
    cost = 500 // 单个部件费用
    mass = 0.002 // 质量（吨）
    crashTolerance = 10 // 抗撞击能力（m/s）
    maxTemp = 2000 // 最高耐受温度（K）
	breakingForce = 1000
	breakingTorque = 500
	stageOffset = -1

	MODULE
	{	
		name = RealChuteModule
		caseMass = 0.05
		timer = 0
		mustGoDown = true
		cutSpeed = 0.5
		spareChutes = 0
		secondaryChute = true
		
		// Main chute
		PARACHUTE
		{
			material = Nylon
			capName = cap
			parachuteName = RC_canopy
			preDeploymentAnimation = RC_chute_semi_deploy
			deploymentAnimation = RC_chute_full_deploy
			preDeployedDiameter = 5
			deployedDiameter = 17
			minIsPressure = false
			minDeployment = 8000
			deploymentAlt = 2000
			cutAlt = -1
			preDeploymentSpeed = 2
			deploymentSpeed = 6
		}
	}

	MODULE
	{
		name = ProceduralChute
		textureLibrary = StockReplacement
		type = Cone
		currentCase = Combo
		currentCanopies = Main chute, Drogue chute
		currentTypes = Main, Drogue
	}
	EFFECTS
	{
		rcpredeploy
		{
			AUDIO
			{
				channel = Ship
				clip = sound_parachute_open
				volume = 1
			}
		}

		rcdeploy
		{
			AUDIO
			{
				channel = Ship
				clip = sound_parachute_single
				volume = 1
			}
		}

		rccut
		{
			AUDIO
			{
				channel = Ship
				clip = RealChute/Sounds/sound_parachute_cut
				volume = 1
			}
		}

		rcrepack
		{
			AUDIO
			{
				channel = Ship
				clip = RealChute/Sounds/sound_parachute_repack
				volume = 1
			}
		}

		nyan
		{
			AUDIO
			{
				channel = Ship
				clip = RealChute/Sounds/nyan_cat
				volume = 0 0
				volume = 1 1
				loop = True
			}
		}
	}
}