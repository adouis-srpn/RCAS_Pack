@PART[ASO-S]:NEEDS[Waterfall]:Final
{
    !EFFECTS {}
    EFFECTS
    {
        fx-dawn-running
        {
            AUDIO
            {
                channel = Ship
                clip = Waterfall/Sounds/NFT/sound_ion_loop
                volume = 0.0 0.0
                volume = 1.0 0.7
                pitch = 0.0 0.8
                pitch = 0.5 0.9
                pitch = 1.0 1.2
                loop = true
            }
        }
        engage
        {
            AUDIO
            {
                channel = Ship
                clip = Waterfall/Sounds/NFT/sound_ion_on
                volume = 0.9
                pitch = 1.0
                loop = false
            }
        }
        disengage
        {
            AUDIO
            {
                channel = Ship
                clip = Waterfall/Sounds/NFT/sound_ion_flameout
                volume = 0.7
                pitch = 1.0
                loop = false
            }
        }
        flameout
        {
            AUDIO
            {
                channel = Ship
                clip = Waterfall/Sounds/NFT/sound_ion_flameout
                volume = 0.7
                pitch = 1.0
                loop = false
            }
        }
    }

    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesFX
        %runningEffectName = fx-dawn-running
        !powerEffectName = DELETE
    }

    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = dawnEngine

        CONTROLLER
        {
        name = atmosphereDepth
        linkedTo = atmosphere_density
        }
        
        CONTROLLER
        {
        name = throttle
        linkedTo = throttle
        engineID = ASO-S
        responseRateUp = 0.005
        responseRateDown = 0.1
        }
        
        
        TEMPLATE
        {
            templateName = stock-xenon-ion
            overrideParentTransform = thrustTransform
            position = 0,0,-0.00029
            rotation = 0, 0, 0
            scale = 0.175, 0.175, 1
            @scale[*] *= #$/rescaleFactor$
        }
    }
}
@PART[ASO-S]:NEEDS[Waterfall]:FINAL
{ 
    !EFFECTS {}
    EFFECTS 
    {
        running
        {
            AUDIO_MULTI_POOL
            {
                channel = Ship
                transformName = RCSthruster
                clip = sound_rocket_hard
                volume = 0.0 0.0
                volume = 0.1 0.0
                volume = 0.5 0.5
                volume = 1.0 0.5
                pitch = 0.0 0.75
                pitch = 1.0 1.5
            loop = true
            }
        }
    }
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = ASO-S_RCS
        engineID = basicEngine

        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = rcs
            linkedTo = rcs
        }
        TEMPLATE
        {
            templateName = waterfall-rcs-jet-1
            overrideParentTransform = RCSthruster
            position = 0,0,0
            rotation = 0, 0, 180
            scale = 0.2, 0.5, 0.2
            @scale[*] *= #$/rescaleFactor$
        }
    }
}