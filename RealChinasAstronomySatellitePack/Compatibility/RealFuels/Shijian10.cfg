@PART[SJ10_server]:NEEDS[RealFuels]:FINAL
{
    @mass = 0.9
    @maxTemp = 2501

    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 900
        basemass = -1
        type = ServiceModule
        TANK
        {
            name = ElectricCharge
            amount = full
            maxAmount = 10000
        }
        TANK
        {
            name = MMH
            amount = Full
            maxAmount = 450
        }
        TANK
        {
            name = NTO
            amount = Full
            maxAmount = 450
        }
    }
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    !MODULE[ModuleEngineConfigs],*{}
    !MODULE[ModuleAlternator],*{}
    !RESOURCE,*{}

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = MMH/NTO
        origMass = 0.9
        modded = false
        CONFIG
        {
            name = SJ10_Main_Engine
            description = 
            minThrust = 0.6
            maxThrust = 2.5
            heatProduction = 100
            massMult = 1.00
            %ullage = False
            %pressureFed = True
            %ignitions = 100	
            PROPELLANT
            {
                name = MMH
                ratio = 0.5
                DrawGauge = true
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.5
            }
            atmosphereCurve
            {
                key = 0 380.0
                key = 1 190.0
            }
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS
        configuration = MMH/NTO
        origMass = 0.9
        modded = false
        CONFIG
        {
            name = MMH/NTO
            thrusterPower = 0.4
            massMult = 1.00
            PROPELLANT
            {
                name = MMH
                ratio = 0.5
                DrawGauge = true
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.5
            }
            atmosphereCurve
            {
                key = 0 290.0
                key = 1 130.0
            }
        }
    }
}
@PART[SJ10_entry]:NEEDS[RealFuels]:FINAL
{
    !MODULE[ModuleFuelTanks],*{}
    !RESOURCE,*{}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 40
        basemass = -1
        type = ServiceModule
        TANK
        {
            name = ElectricCharge
            amount = full
            maxAmount = 5000
        }
        TANK
        {
            name = MMH
            amount = Full
            maxAmount = 20
        }
        TANK
        {
            name = NTO
            amount = Full
            maxAmount = 20
        }
    }
        
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
        @minThrust = 20
        @maxThrust = 20
        %allowShutdown = False
        %throttleLocked = True
        !PROPELLANT[*],* {}
        PROPELLANT
        {
            name = PBAN
            ratio = 1
        }
        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 250
            key = 1 200
        }
    }
    RESOURCE
    {
        name = PBAN
        amount = 2
        maxAmount = 2
    }
    @MODULE[CL_LandingBurn]
    {
        @burnAltitude = 2.0
    }
    
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS,*
        techLevel = 1
        origTechLevel = 1
        engineType = L
        origMass = 0.4
        configuration = MMH/NTO
        modded = false
        CONFIG
        {
            name = MMH/NTO
            thrusterPower = 0.2
            PROPELLANT
            {
                name = MMH
                ratio = 0.5
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.5
            }
            atmosphereCurve
            {
                key = 0 310
                key = 1 250
            }
        }
    }
}