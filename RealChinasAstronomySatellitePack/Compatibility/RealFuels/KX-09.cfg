@PART[Taiji-1]:NEEDS[RealFuels]:FINAL
{
    @mass = 2.0
    @maxTemp = 2200

    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 1650
        basemass = -1
        type = ServiceModule
        TANK
        {
            name = XenonGas
            amount = Full
            maxAmount = 1600
        }  
        TANK
        {
            name = ElectricCharge
            amount = full
            maxAmount = 30060
        }
    }
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    !MODULE[ModuleEngineConfigs],*{}
    !MODULE[ModuleAlternator],*{}
    !RESOURCE,*{}

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        origMass = 2
        modded = false
        CONFIG
        {
            name = Taiji-1_Engine
            description = 
            minThrust = 0.0
            maxThrust = 0.5
            heatProduction = 100
            massMult = 1.00
            %ullage = False
            %pressureFed = True
            %ignitions = 100	
            PROPELLANT
            {
                name = XenonGas
                ratio = 0.5
            }
            PROPELLANT
            {
                name = ElectricCharge
                ratio = 0.5
                DrawGauge = true
            }
            atmosphereCurve
            {
                key = 0 6010.0
                key = 1 150.0
            }
        }
    }
}