@PART[Einstein_Probe]:NEEDS[RealFuels]:FINAL
{
    @mass = 1.3
    @maxTemp = 2150

    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 65
        basemass = -1
        type = ServiceModule
        TANK
        {
            name = ElectricCharge
            amount = full
            maxAmount = 30500
        }
        TANK
        {
            name = MMH
            amount = Full
            maxAmount = 30
        }
        TANK
        {
            name = NTO
            amount = Full
            maxAmount = 30
        }
    }
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    !MODULE[ModuleEngineConfigs],*{}
    !MODULE[ModuleAlternator],*{}
    !RESOURCE,*{}

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS
        configuration = MMH/NTO
        origMass = 1.2
        modded = false
        CONFIG
        {
            name = MMH/NTO
            thrusterPower = 0.3
            massMult = 1.00
            PROPELLANT
            {
                name = MMH
                ratio = 0.5
                DrawGauge = true
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.5
            }
            atmosphereCurve
            {
                key = 0 286.0
                key = 1 130.0
            }
        }
    }
}