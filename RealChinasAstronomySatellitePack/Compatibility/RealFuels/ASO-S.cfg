@PART[ASO-S]:NEEDS[RealFuels]:FINAL
{
    @mass = 0.888
    @maxTemp = 2200

    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 1560
        basemass = -1
        type = ServiceModule
        TANK
        {
            name = ElectricCharge
            amount = full
            maxAmount = 30000
        }
        TANK
        {
            name = MMH
            amount = Full
            maxAmount = 30
        }
        TANK
        {
            name = NTO
            amount = Full
            maxAmount = 30
        }
        TANK
        {
            name = XenonGas
            amount = Full
            maxAmount = 1500
        }  
    }
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    !MODULE[ModuleEngineConfigs],*{}
    !MODULE[ModuleAlternator],*{}
    !RESOURCE,*{}

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        origMass = 0.888
        modded = false
        CONFIG
        {
            name = ASO-S_Engine
            description = 
            minThrust = 0
            maxThrust = 0.5
            heatProduction = 100
            massMult = 1.00
            %ullage = False
            %pressureFed = True
            %ignitions = 100	
            PROPELLANT
            {
                name = XenonGas
                ratio = 0.5
            }
            PROPELLANT
            {
                name = ElectricCharge
                ratio = 0.5
                DrawGauge = true
            }
            atmosphereCurve
            {
                key = 0 6010.0
                key = 1 150.0
            }
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS
        configuration = MMH/NTO
        origMass = 0.888
        modded = false
        CONFIG
        {
            name = MMH/NTO
            thrusterPower = 0.2
            massMult = 1.00
            PROPELLANT
            {
                name = MMH
                ratio = 0.5
                DrawGauge = true
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.5
            }
            atmosphereCurve
            {
                key = 0 285.0
                key = 1 110.0
            }
        }
    }
}