@PART[smile_cas]:NEEDS[RealFuels]:FINAL
{
    @mass = 2.3
    @maxTemp = 2501

    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 800
        basemass = -1
        type = ServiceModule
        TANK
        {
            name = ElectricCharge
            amount = full
            maxAmount = 10000
        }
        TANK
        {
            name = MMH
            amount = Full
            maxAmount = 400
        }
        TANK
        {
            name = NTO
            amount = Full
            maxAmount = 400
        }
    }
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    !MODULE[ModuleEngineConfigs],*{}
    !MODULE[ModuleAlternator],*{}
    !RESOURCE,*{}

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = MMH/NTO
        origMass = 1.4
        modded = false
        CONFIG
        {
            name = SMILE_Main_Engine
            description = 
            minThrust = 0.6
            maxThrust = 0.6
            heatProduction = 100
            massMult = 1.00
            %ullage = False
            %pressureFed = True
            %ignitions = 100	
            PROPELLANT
            {
                name = MMH
                ratio = 0.5
                DrawGauge = true
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.5
            }
            atmosphereCurve
            {
                key = 0 360.0
                key = 1 190.0
            }
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS
        configuration = MMH/NTO
        origMass = 1.4
        modded = false
        CONFIG
        {
            name = MMH/NTO
            thrusterPower = 0.2
            massMult = 1.00
            PROPELLANT
            {
                name = MMH
                ratio = 0.5
                DrawGauge = true
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.5
            }
            atmosphereCurve
            {
                key = 0 295.0
                key = 1 130.0
            }
        }
    }
}