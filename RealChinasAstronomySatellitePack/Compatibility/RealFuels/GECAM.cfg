@PART[KX-08A]:NEEDS[RealFuels]:FINAL
{
    @mass = 0.15
    @maxTemp = 2200

    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 40
        basemass = -1
        type = ServiceModule
        TANK
        {
            name = ElectricCharge
            amount = full
            maxAmount = 20000
        }
        TANK
        {
            name = MMH
            amount = Full
            maxAmount = 20
        }
        TANK
        {
            name = NTO
            amount = Full
            maxAmount = 20
        }
    }
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    !MODULE[ModuleEngineConfigs],*{}
    !MODULE[ModuleAlternator],*{}
    !RESOURCE,*{}

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = MMH/NTO
        origMass = 0.1
        modded = false
        CONFIG
        {
            name = GECAM_Engine
            description = 
            minThrust = 0.3
            maxThrust = 0.3
            heatProduction = 120
            massMult = 1.00
            %ullage = False
            %pressureFed = True
            %ignitions = 100	
            PROPELLANT
            {
                name = MMH
                ratio = 0.5
                DrawGauge = true
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.5
            }
            atmosphereCurve
            {
                key = 0 290.0
                key = 1 151.0
            }
        }
    }
}