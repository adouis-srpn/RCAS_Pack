@PART[SJ10_depart]:NEEDS[RealismOverhaul] 
{
  %RSSROConfig = True
  %rescaleFactor = 1
}
@PART[SJ10_entry]:NEEDS[RealismOverhaul] 
{
  %RSSROConfig = True
  %rescaleFactor = 1
  @mass = 0.4
    %maxTemp = 3200
    %skinMaxTemp = 4000
}

@PART[SJ10_entry]:NEEDS[RealismOverhaul]
{
    %reactionWheelPowerDraw = 0.01
    %reactionWheelMode = CMG
}
@PART[SJ10_HeatShield]:NEEDS[RealismOverhaul] 
{
  %RSSROConfig = True
  %rescaleFactor = 1
    %maxTemp = 3200
    %skinMaxTemp = 4000
}
@PART[SJ10_HeatShield]:BEFORE[RealismOverhaul_HeatShield]
{
    %heatShieldTag = LEO
}
@PART[SJ10_parachute]:NEEDS[RealismOverhaul] 
{
  %RSSROConfig = True
  %rescaleFactor = 1
    %maxTemp = 3200
    %skinMaxTemp = 4000
}
@PART[SJ10_server]:NEEDS[RealismOverhaul] 
{
  %RSSROConfig = True
  %rescaleFactor = 1
  @mass = 0.9
  @maxTemp = 2900
  @chargeRate = 0.805
}
@PART[SJ10_server]:NEEDS[RealismOverhaul]
{
    %reactionWheelPowerDraw = 0.1
    %reactionWheelMode = CMG
}
