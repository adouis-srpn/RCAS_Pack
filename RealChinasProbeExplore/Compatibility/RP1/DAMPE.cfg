// ============================================================
// RealChinasProbeExplore - RP-1 Compatibility Patch
// DAMPE (Dark Matter Particle Explorer, 暗物质粒子探测卫星)
//
// 作用:
//   1. 设置 RP0conf=True，使 RP-1 的 NonRP0.cfg 不再把该部件
//      移到 category 99/-1（隐藏）。需在 BEFORE[zzzRP-0] 执行。
//   2. 把 TechRequired 从 stock 的 advScienceTech 映射到 RP-1
//      历史科技树节点。
//   3. 添加 Instruments ModuleTagList 标签，参与 RP-1 工具/采购
//      分组（科学载荷/天线类）。
//   4. 修正 entryCost：原值 50 在 RP-1 生涯下解锁费过低，
//      按 ~5x cost 规则调整为 3250 (cost=650)。
//
// 参考年份: 2015-12-17 (DAMPE 发射)
// 目标节点: materialsScienceCommercial (Materials, 2009-2018)
//   暗物质探测归为材料科学类。
//
// Author: Zhuwenqian
// ============================================================

@PART[dark_matter_detector]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
    %RP0conf = True
    @TechRequired = materialsScienceCommercial
    @entryCost = 3250
    %MODULE[ModuleTagList] { tag = Instruments }
}
